# RICONs — tool declarations (v3).
# Mỗi description: làm gì · DÙNG khi · KHÔNG dùng khi. Convention args nằm trong description của từng param.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
# `pytest tests/test_tool_contract.py` checks this sync for you.
#
# Tool mới của nhóm: khai báo ở CUỐI file (sau mục "Group tools").
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >-
      Hỏi lại user một câu rồi chờ lượt trả lời tiếp theo.
      DÙNG khi: (1) thiếu thông tin bắt buộc để gọi tool khác — chưa biết tài khoản X cần xem, chưa có URL cần đọc → response_type="text";
      (2) user yêu cầu gửi/đăng/publish nội dung ra ngoài (Telegram...) mà chưa xác nhận → LUÔN dùng response_type="yes_no" để xin xác nhận gửi, kể cả khi nội dung còn chưa rõ (nêu nội dung dự kiến trong câu hỏi).
      KHÔNG dùng khi: yêu cầu đã đủ thông tin để gọi tool; câu hỏi ngoài phạm vi hoặc câu hỏi về bản thân agent (trả lời trực tiếp).
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Một câu hỏi ngắn, cụ thể, nói rõ đang thiếu gì hoặc đang xin xác nhận việc gì."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "'text' khi xin thông tin còn thiếu (tài khoản, URL); 'yes_no' khi xin xác nhận trước hành động gửi/đăng; 'choice' khi đưa ra các lựa chọn cố định trong `options`."}
        options: {type: array, default: [], items: {type: string}, description: "Chỉ dùng khi response_type='choice'; để trống với các kiểu khác."}
      required: [question]

  - name: timeline
    description: >-
      Lấy các tweet gần đây của MỘT tài khoản X/Twitter cụ thể.
      DÙNG khi: user nêu rõ người hoặc tài khoản (vd. "tweet mới nhất của Sam Altman", "10 tweet của Elon Musk").
      KHÔNG dùng khi: tìm tweet theo chủ đề/từ khóa (→ social_search); chưa biết tài khoản nào (→ clarify, không tự đoán).
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle X KHÔNG có '@'. Đổi tên người thành handle: Sam Altman → sama, Elon Musk → elonmusk, Andrej Karpathy → karpathy. Nếu user sửa lại người ở lượt sau, dùng người mới nhất."}
        limit: {type: integer, default: 5, description: "Đúng số tweet user yêu cầu. Trong hội thoại nhiều lượt, giữ số đã nêu trước đó trừ khi user sửa lại; nếu user sửa thì dùng số mới nhất."}
      required: [screenname]

  - name: social_search
    description: >-
      Tìm tweet trên X/Twitter theo từ khóa hoặc chủ đề.
      DÙNG khi: user hỏi mọi người đang bàn gì về một chủ đề trên Twitter/X, hoặc muốn tweet phổ biến/mới nhất về một chủ đề.
      KHÔNG dùng khi: muốn tweet của một tài khoản cụ thể (→ timeline); muốn tin tức/thông tin trên web (→ lookup); user đã bảo bỏ Twitter.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ là từ khóa chủ đề ngắn gọn, giữ nguyên tên riêng, vd. 'AI', 'GPT-5', 'OpenAI'. KHÔNG thêm các từ chỉ loại nội dung hay thời gian như 'tweet', 'Twitter', 'mới nhất', 'hôm nay'."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "'Top' khi user nói phổ biến / nổi bật / top / nhiều tương tác; còn lại 'Latest'."}
        limit: {type: integer, default: 5, description: "Số tweet user yêu cầu; không nói thì để mặc định."}
      required: [query]

  - name: lookup
    description: >-
      Tìm kiếm trên web: tin tức, sự kiện, thông tin chung.
      DÙNG khi: user hỏi tin tức / có gì mới / thông tin về một chủ đề trên web; user bảo chuyển từ Twitter sang tìm web.
      KHÔNG dùng khi: user đã đưa URL cụ thể (→ fetch); user hỏi về tweet/Twitter (→ social_search / timeline); tìm paper khoa học (→ papers); hỏi chính sách nội bộ (→ policy).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chỉ là từ khóa chủ đề ngắn gọn, giữ nguyên tên riêng và ngôn ngữ gốc của chủ đề, vd. 'AI', 'robotics', 'OpenAI'. KHÔNG thêm 'tin tức', 'news', 'hôm nay', 'today', 'tuần này'... vì loại nội dung đã nằm ở `topic` và thời gian đã nằm ở `timeframe`."}
        topic: {type: string, enum: [general, news], default: "general", description: "'news' khi user hỏi tin tức / thời sự / có gì mới; 'general' cho tra cứu thông tin chung. Giữ nguyên qua các lượt nếu user chỉ đổi chủ đề."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "'hôm nay' → day, 'tuần này' → week, 'tháng này' → month, 'năm nay' → year. Trong hội thoại nhiều lượt, giữ khoảng thời gian đã nêu trước đó nếu user không đổi."}
        max_results: {type: integer, default: 5, description: "Số kết quả user yêu cầu; không nói thì để mặc định."}
      required: [query]

  - name: fetch
    description: >-
      Đọc nội dung của MỘT URL cụ thể (bài báo, blog).
      DÙNG khi: user đưa URL và muốn đọc/tóm tắt nội dung đó.
      KHÔNG dùng khi: chưa có URL (→ clarify, không tự bịa URL); cần tìm kiếm nhiều nguồn (→ lookup).
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ, chép nguyên văn từ user (gồm https://). Không sửa, không đoán."}
      required: [url]

  - name: format
    description: >-
      Trình bày các item ĐÃ có (từ kết quả tool trước) thành markdown digest.
      DÙNG khi: user yêu cầu trình bày/định dạng bản tin, digest, thread từ dữ liệu đã thu thập.
      KHÔNG dùng khi: chưa có dữ liệu; để tìm dữ liệu mới; user không yêu cầu định dạng.
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item lấy từ kết quả tool trước; mỗi item nên có title, url, source, summary."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "'brief' ngắn gọn; 'sections' nhóm theo section; 'bullets' gạch đầu dòng; 'thread' đánh số 1/, 2/ như thread; 'daily_ai_vn' bản tin AI tiếng Việt hằng ngày."}
        headline: {type: string, default: "", description: "Tiêu đề digest; để trống nếu user không yêu cầu."}
      required: [items, template]

  # ---------------- Optional tools ----------------
  - name: send
    description: >-
      Gửi text lên Telegram channel riêng của nhóm. Đây là hành động ra bên ngoài, KHÔNG thể thu hồi.
      CHỈ DÙNG khi: user đã xác nhận rõ ràng ("có", "ok gửi đi") ở lượt trước cho đúng nội dung sẽ gửi → đặt confirmed=true.
      KHÔNG dùng khi: user vừa mới yêu cầu gửi/đăng mà chưa xác nhận (→ clarify với response_type="yes_no" trước); nội dung còn trống hoặc chưa rõ.
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung chính xác đã được user xác nhận; không để trống, không dùng placeholder."}
        confirmed: {type: boolean, default: false, description: "true CHỈ khi user đã xác nhận rõ ràng ở lượt trước; nếu chưa xác nhận thì không gọi send."}
      required: [text]

  - name: policy
    description: >-
      Tìm trong tài liệu chính sách nội bộ của công ty (AI research, trích dẫn nguồn, data privacy, publish ra ngoài, dùng tool).
      DÙNG khi: user hỏi quy định/chính sách nội bộ, vd. "công ty có cho phép đăng bài nghiên cứu ra ngoài không?".
      KHÔNG dùng khi: hỏi thông tin công khai trên web (→ lookup).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Câu hỏi hoặc từ khóa về chính sách."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm chính sách nếu xác định được rõ; không chắc thì 'all'."}
        top_k: {type: integer, default: 3, description: "Số đoạn chính sách trả về."}
      required: [query]

  - name: papers
    description: >-
      Tìm paper khoa học trên arXiv.
      DÙNG khi: user muốn tìm paper/bài báo khoa học/nghiên cứu học thuật về một chủ đề.
      KHÔNG dùng khi: muốn tin tức (→ lookup); đã có link/ID arXiv cụ thể và muốn đọc nội dung (→ paper_text).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề nghiên cứu, ngắn gọn, ưu tiên tiếng Anh, vd. 'retrieval augmented generation'."}
        max_results: {type: integer, default: 5, description: "Số paper user yêu cầu; không nói thì để mặc định."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "'submittedDate' khi user muốn paper mới nhất; còn lại 'relevance'."}
      required: [query]

  - name: paper_text
    description: >-
      Tải PDF của một paper arXiv và trích nội dung text.
      DÙNG khi: user đưa link hoặc ID arXiv cụ thể và muốn đọc/tóm tắt nội dung paper.
      KHÔNG dùng khi: chưa có paper cụ thể (→ papers để tìm trước); URL không phải arXiv (→ fetch).
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID arXiv (vd. '2401.12345') hoặc URL arxiv.org, chép nguyên văn từ user."}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần đọc."}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa trả về."}
      required: [arxiv_url]

  # ---------------- Group tools ----------------
  - name: wiki
    description: >-
      Tra Wikipedia và trả về đoạn mở đầu của bài khớp nhất kèm link (kiến thức nền ổn định, không phải tin mới).
      DÙNG khi: user hỏi định nghĩa một khái niệm ("X là gì"), tiểu sử một người ("X là ai"), hoặc lịch sử một tổ chức/công nghệ.
      KHÔNG dùng khi: tin tức hoặc sự kiện mới (→ lookup với topic=news); bài đăng/tweet (→ timeline / social_search); user đã đưa URL cụ thể (→ fetch).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Tên bài hoặc khái niệm cần tra, ngắn gọn, không kèm từ hỏi (vd. 'Alan Turing', không phải 'Alan Turing là ai')."}
        lang: {type: string, enum: [vi, en], default: "vi", description: "Ngôn ngữ Wikipedia. Mặc định vi; dùng en khi user hỏi bằng tiếng Anh hoặc yêu cầu nguồn tiếng Anh."}
        max_results: {type: integer, default: 1, description: "Số bài trả về, từ 1 đến 5. Mặc định 1; chỉ tăng khi user muốn so sánh nhiều bài."}
      required: [query]

  - name: github_repo
    description: >-
      Lấy trạng thái hiện tại của MỘT repo GitHub public: số sao, fork, issue đang mở, license, ngôn ngữ, lần push cuối, có bị archive không.
      DÙNG khi: user hỏi về một repo code cụ thể (vd. "repo LangGraph bao nhiêu sao", "repo này còn được maintain không", "license của repo X"), kể cả khi user dán link github.com của repo.
      KHÔNG dùng khi: muốn đọc nội dung một trang web/bài viết (→ fetch); tin tức về công ty hay sản phẩm (→ lookup với topic=news); chưa biết repo nào (→ clarify).
    parameters:
      type: object
      properties:
        repo: {type: string, default: "", description: "Repo dạng 'owner/name' (vd. 'langchain-ai/langgraph'), hoặc chép nguyên link github.com user đưa. Không tự đoán owner nếu user không nói và không chắc."}
      required: [repo]

  - name: hn_search
    description: >-
      Tìm bài thảo luận trên Hacker News (cộng đồng kỹ thuật news.ycombinator.com) theo từ khóa; trả tiêu đề, link, điểm, số bình luận.
      DÙNG khi: user hỏi Hacker News / HN / dân kỹ thuật trên HN đang bàn gì về một chủ đề.
      KHÔNG dùng khi: hỏi về Twitter/X (→ social_search hoặc timeline); tin tức báo chí chung (→ lookup với topic=news); paper khoa học (→ papers).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề ngắn, không kèm 'Hacker News' hay từ chỉ thời gian (vd. 'LangGraph')."}
        sort: {type: string, enum: [relevance, latest], default: "relevance", description: "'latest' khi user muốn bài mới nhất/gần đây; còn lại 'relevance'."}
        limit: {type: integer, default: 5, description: "Số bài user yêu cầu, từ 1 đến 10; không nói thì để mặc định."}
      required: [query]

  - name: hf_model
    description: >-
      Tra model trên Hugging Face Hub theo tên hoặc id: license, task (pipeline), lượt tải, lượt thích, gated hay không, ngày cập nhật.
      DÙNG khi: user hỏi thông tin model card của một model AI (vd. "Llama 3.1 8B Instruct có license gì", "model Qwen2.5 dùng cho task gì", "model nào tải nhiều nhất").
      KHÔNG dùng khi: tìm paper nghiên cứu (→ papers); tin tức về model hay công ty (→ lookup với topic=news); giải thích khái niệm chung (→ wiki).
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Tên hoặc id model, giữ nguyên cách user viết (vd. 'Llama-3.1-8B-Instruct' hoặc 'Qwen/Qwen2.5-7B-Instruct')."}
        limit: {type: integer, default: 3, description: "Số model trả về, từ 1 đến 5; không nói thì để mặc định."}
      required: [query]
